# 部署到 GitHub Pages。
# 只发布书本体（index / chapters / assets）：
# sample/ 是旧版样章、archive/ 是存档，BUILD_SPEC / OUTLINE / QUALITY / CLAUDE / README 是构建文档，
# tools/ 是检查脚本，都不属于站点。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site (book only)
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R chapters assets _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
